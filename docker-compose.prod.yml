services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: biolabs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: biolabs
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db
    networks:
      - app-network

  diagnosis:
    build:
      context: ./diagnosis
      dockerfile: Dockerfile
    container_name: diagnosis
    restart: unless-stopped
    environment:
      BACKEND_API_URL: "http://backend:8000/backend"
    networks:
      - app-network

  detection:
    build:
      context: ./detection
      dockerfile: Dockerfile
    container_name: detection
    restart: unless-stopped
    environment:
      BACKEND_API_URL: "http://backend:8000/backend"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - app-network

  biofold-frontend:
    build:
      context: ./biofold_frontend
      dockerfile: Dockerfile
    container_name: biofold-frontend
    restart: unless-stopped
    networks:
      - app-network

  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: intelligence
    restart: unless-stopped
    env_file:
      - ./intelligence/.env
    volumes:
      - ./intelligence/database:/app/database
      - ./intelligence/vectors:/app/vectors
      - ./intelligence/embedding_model:/app/embedding_model
      - ./intelligence/dataset:/app/dataset
      - ./intelligence/model:/app/model
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./frontend/public:/usr/share/nginx/html/public
      - ./frontend/static:/usr/share/nginx/html/static
      - ./backend/static:/usr/share/nginx/html/static
      - ./backend/static/media:/usr/share/nginx/html/static/media
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
      - biofold-frontend
      - diagnosis
      - detection

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
