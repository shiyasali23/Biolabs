services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: biolabs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Backend service for Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: biolabs
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db
    networks:
      - app-network
    

  # Diagnosis service for Fast API
  diagnosis:
    build:
      context: ./diagnosis
      dockerfile: Dockerfile
    container_name: diagnosis
    ports:
      - "8001:8001"
    networks:
      - app-network
    

  # Detection service for Fast API
  detection:
    build:
      context: ./detection
      dockerfile: Dockerfile
    container_name: detection
    ports:
      - "8002:8002"
    networks:
      - app-network
    

  # Frontend service for Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    

  # Nginx service
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    volumes:
      - ./frontend/public:/usr/share/nginx/html/public
      - ./frontend/static:/usr/share/nginx/html/static
      - ./backend/static:/usr/share/nginx/html/static
      - ./backend/static/media:/usr/share/nginx/html/static/media
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    

networks:
  app-network:
    driver: bridge

volumes:
  pg_data: