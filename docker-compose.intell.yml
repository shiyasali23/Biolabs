version: '3.8'

services:
  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: intelligence_service
    ports:
      - "8003:8003"
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: AKIAQLSIVXKT626IVTKH
      AWS_SECRET_ACCESS_KEY: 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
    volumes:
      - ./intelligence/database:/app/database
      - ./intelligence/vectors:/app/vectors
      - ./intelligence/embedding_model:/app/embedding_model
      - ./intelligence/dataset:/app/dataset
      - ./intelligence/model:/app/model
    networks:
      - intelligence-net

  nginx-intelligence:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-intelligence
    volumes:
      - ./nginx/nginx.intelligence.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443"
      - "80:80"
    networks:
      - intelligence-net
    depends_on:
      - intelligence

networks:
  intelligence-net:
    driver: bridge

volumes:
  intelligence_data_volume: 