events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    # Define upstreams for the services
    upstream frontend {
        server frontend:3000;
    }
    
    upstream diagnosis {
        server diagnosis:8001;
    }
    
    upstream detection {
        server detection:8002;
    }
    
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name www.biolabsltd.com biolabsltd.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.biolabsltd.com biolabsltd.com;

        ssl_certificate /etc/letsencrypt/live/biolabsltd.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/biolabsltd.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /diagnosis/ {
            proxy_pass http://diagnosis;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /detection/ {
            proxy_pass http://detection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10M;
        }

        location /backend/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
