events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    upstream frontend {
        server frontend:3000;
    }

    upstream diagnosis {
        server diagnosis:8001;
    }

    upstream detection {
        server detection:8002;
    }

    upstream backend {
        server backend:8000;
    }

    upstream intelligence {
        server host.docker.internal:8003; 
    }

    server {
        listen 80;
        server_name www.biolabsltd.com biolabsltd.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.biolabsltd.com biolabsltd.com;

        ssl_certificate /etc/letsencrypt/live/biolabsltd.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/biolabsltd.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        # Frontend (React/Next.js)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Diagnosis Service
        location /diagnosis/ {
            proxy_pass http://diagnosis/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Detection Service
        location /detection/ {
            proxy_pass http://detection/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10M;
        }

        # Backend Service
        location /backend/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Intelligence Service (Running on Host)
        location /intelligence/ {
            proxy_pass http://intelligence/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Handle preflight CORS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}