worker_processes auto;
error_log /var/log/nginx/intelligence_error.log;
pid       /var/run/nginx_intelligence.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream intelligence {
        # Update to point to the intelligence service container name and correct port
        server intelligence:8003;
    }

    server {
        listen 80;
        server_name www.biolabsltd.com;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.biolabsltd.com;

        ssl_certificate     /etc/letsencrypt/live/www.biolabsltd.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.biolabsltd.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        access_log  /var/log/nginx/intelligence_access.log;
        error_log   /var/log/nginx/intelligence_error.log;

        location / {
            proxy_pass         http://intelligence;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}