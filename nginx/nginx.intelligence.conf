# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name intelligence.biolabsltd.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name intelligence.biolabsltd.com;

    # SSL configuration
    ssl_certificate     /etc/letsencrypt/live/intelligence.biolabsltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intelligence.biolabsltd.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log  /var/log/nginx/intelligence_access.log;
    error_log   /var/log/nginx/intelligence_error.log;

    # Proxy to FastAPI backend
    location / {
        proxy_pass         http://intelligence:8003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
